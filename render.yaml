services:
  - type: web
    name: shipoverseas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run shipoverseas:start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: EMAIL_FROM
        value: ShipOverseas <updates@shipoversea.site>
      - key: EMAIL_REPLY_TO
        value: hardewusi@gmail.com
